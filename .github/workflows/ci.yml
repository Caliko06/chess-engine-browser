name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phase-0:
    name: Phase 0 harness
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: just check

      - name: Run tests
        run: just test

      - name: Run build smoke
        run: just build

      - name: Oracle validation is local-only
        run: echo "Skipping just oracle in CI. Stockfish oracle validation is local-only and opt-in."
